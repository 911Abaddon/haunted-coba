
<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b12">
  <title>HAUNTED COBA | Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: #100b12;
      color: #f5edf5;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .admin-panel {
      max-width: 520px;
      margin: 50px auto;
      padding: 28px;
      background: #201723;
      border: 1px solid #59344e;
      border-radius: 16px;
    }
    h1 { color: #ff526f; margin-top: 0; }
    label { display: block; margin: 18px 0 8px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #65435e;
      border-radius: 8px;
      background: #130f16;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #d82d51;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    .secondary { background: #493447; }
    #status { margin-top: 18px; overflow-wrap: anywhere; }
    #result {
      display: none;
      margin-top: 18px;
      padding: 16px;
      background: #14251b;
      border: 1px solid #36744b;
      border-radius: 8px;
    }
    #temporaryPassword {
      display: block;
      margin: 12px 0;
      font-size: 18px;
      overflow-wrap: anywhere;
      user-select: all;
    }
    .muted { color: #b7a9b8; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="admin-panel">
    <h1>HAUNTED COBA</h1>
    <p class="muted">ADMIN PANEL · Password Reset</p>

    <section id="loginSection">
      <h2>Admin login</h2>
      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" value="test1" autocomplete="username" required>

        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password"
               autocomplete="current-password" required>

        <button id="loginButton" type="submit">Login</button>
      </form>
    </section>

    <section id="resetSection" hidden>
      <h2>Reset player password</h2>
      <form id="resetForm">
        <label for="targetUsername">Player username</label>
        <input id="targetUsername" minlength="3" maxlength="24"
               pattern="[a-zA-Z0-9_]+" autocomplete="off" required>
        <button id="resetButton" type="submit">Reset Password</button>
      </form>
      <button id="logoutButton" class="secondary" type="button">Logout</button>
    </section>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="result" aria-live="polite">
      <strong>Password reset successfully</strong>
      <p>Player: <span id="resultUsername"></span></p>
      <code id="temporaryPassword"></code>
      <button id="copyButton" type="button">Copy temporary password</button>
      <p class="muted">Δώσε τον προσωρινό κωδικό μόνο στον συγκεκριμένο παίκτη.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>

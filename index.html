
<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b080d">
  <title>HAUNTED COBA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-container">
    <p class="eyebrow">31.10.26 · SISSI, CRETE</p>
    <h1>HAUNTED <span>COBA</span></h1>
    <p class="subtitle">The game has begun. Do you dare to enter?</p>

    <div class="auth-tabs">
      <button id="show-login" class="tab active" type="button">Σύνδεση</button>
      <button id="show-register" class="tab" type="button">Εγγραφή</button>
    </div>

    <form id="auth-form">
      <div id="name-field" hidden>
        <label for="full-name">Ονοματεπώνυμο</label>
        <input id="full-name" name="full_name" autocomplete="name"
          placeholder="Το όνομά σου" maxlength="100">
      </div>

      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username"
        placeholder="π.χ. ghost_26" minlength="3" maxlength="24"
        pattern="[a-z0-9_]+" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
        autocomplete="current-password" minlength="10" maxlength="128"
        placeholder="Τουλάχιστον 10 χαρακτήρες" required>

      <button id="auth-submit" class="primary-button" type="submit">
        ΣΥΝΔΕΣΗ
      </button>
      <p id="auth-message" class="message" role="status" aria-live="polite"></p>
    </form>

    <p class="footer-text">15 CLUES. ONE FINAL DESTINATION.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
